name: check
on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12.1'
      - run: |
          gradle raygun-spring-boot-starter:jar
          gradle raygun-spring-boot-starter-example:jar
      - uses: actions/upload-artifact@v7
        with:
          overwrite: 'true'
          path: |
            raygun-spring-boot-starter/build
            raygun-spring-boot-starter-example/build
  check-starter:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12.1'
      - uses: actions/download-artifact@v8
        with:
          path: |
            raygun-spring-boot-starter/build
            raygun-spring-boot-starter-example/build
      - run: gradle raygun-spring-boot-starter:check raygun-spring-boot-starter:jacocoTestReport
  check-starter-example:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12.1'
      - uses: actions/download-artifact@v8
        with:
          path: |
            raygun-spring-boot-starter/build
            raygun-spring-boot-starter-example/build
      - run: gradle raygun-spring-boot-starter-example:check raygun-spring-boot-starter-example:jacocoTestReport
  check-starter-example-web:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12.1'
      - uses: actions/download-artifact@v8
        with:
          path: |
            raygun-spring-boot-starter/build
            raygun-spring-boot-starter-example/build
      - run: gradle raygun-spring-boot-starter-example-web:check raygun-spring-boot-starter-example-web:jacocoTestReport
  check-starter-example-web-services:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12.1'
      - uses: actions/download-artifact@v8
        with:
          path: |
            raygun-spring-boot-starter/build
            raygun-spring-boot-starter-example/build
      - run: gradle raygun-spring-boot-starter-example-web-services:check raygun-spring-boot-starter-example-web-services:jacocoTestReport
